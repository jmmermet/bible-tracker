<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Bible – Étape 1 (header + progression)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --bg: #f7f7f9;
      --card: #ffffff;
      --text: #222;
      --muted: #666;
      --accent: #2563eb;
      --accent-weak: #dbeafe;
      --border: #e5e7eb;
      --success: #16a34a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b0f14;
        --card: #111827;
        --text: #e5e7eb;
        --muted: #9ca3af;
        --accent: #60a5fa;
        --accent-weak: #1e3a8a;
        --border: #1f2937;
        --success: #22c55e;
      }
    }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.35;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 30;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      padding: 0.6rem 0.75rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      align-items: center;
      justify-content: space-between;
    }
    header h1 {
      font-size: 0.95rem;
      margin: 0;
      font-weight: 600;
    }
    .progress-wrap {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex: 1;
      min-width: 140px;
    }
    .progress-bar {
      flex: 1;
      height: 8px;
      background: var(--border);
      border-radius: 999px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: var(--success);
      width: 0%;
      transition: width 0.25s ease;
    }
    .progress-text {
      font-size: 0.7rem;
      color: var(--muted);
      min-width: 45px;
      text-align: right;
    }

    main {
      padding: 0.6rem;
      max-width: 900px;
      margin: 0 auto;
      width: 100%;
    }

    .section-title {
      font-size: 1.05rem;
      font-weight: 700;
      margin: 0.9rem 0 0.35rem;
    }
    .book {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.55rem;
      margin-bottom: 0.65rem;
    }
    .book-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.35rem;
    }
    .book-title {
      font-weight: 600;
      font-size: 0.9rem;
    }
    .book-progress {
      font-size: 0.65rem;
      color: var(--muted);
    }
    .chapters {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(2rem, 1fr));
      gap: 0.25rem;
    }
    .chapter {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.25rem 0;
      font-size: 0.8rem;
      font-weight: 500;
      user-select: none;
      cursor: pointer;
      background: var(--card);
      color: var(--text);
      min-height: 1.8rem;
      text-align: center;
    }
    .chapter.checked {
      background: var(--accent-weak);
      border-color: var(--accent);
      color: var(--accent);
      font-weight: 600;
    }
  </style>
</head>
<body>
  <header>
    <h1>Suivi de lecture de la Bible</h1>
    <div class="progress-wrap">
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="progress-text" id="progressText">0%</div>
    </div>
  </header>

    const STORAGE_KEY = "bibleProgress_etape1_v1";

    function loadProgress() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return {};
        const data = JSON.parse(raw);
        if (typeof data !== "object" || data === null) return {};
        return data;
      } catch {
        return {};
      }
    }

    function saveProgress(data) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }

    function chapterKey(bookName, chapterNumber) {
      return `${bookName}:${chapterNumber}`;
    }
