<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Suivi de lecture de la Bible</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --bg: #f7f7f9;
      --card: #ffffff;
      --text: #222;
      --muted: #666;
      --accent: #2563eb;
      --accent-weak: #dbeafe;
      --border: #e5e7eb;
      --success: #16a34a;
      --overlay-bg: rgba(0,0,0,0.6);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b0f14;
        --card: #111827;
        --text: #e5e7eb;
        --muted: #9ca3af;
        --accent: #60a5fa;
        --accent-weak: #1e3a8a;
        --border: #1f2937;
        --success: #22c55e;
      }
    }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.35;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 30;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      padding: 0.6rem 0.75rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      align-items: center;
      justify-content: space-between;
    }
    header h1 {
      font-size: 0.95rem;
      margin: 0;
      font-weight: 600;
    }
    .progress-wrap {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex: 1;
      min-width: 140px;
    }
    .progress-bar {
      flex: 1;
      height: 8px;
      background: var(--border);
      border-radius: 999px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: var(--success);
      width: 0%;
      transition: width 0.25s ease;
    }
    .progress-text {
      font-size: 0.7rem;
      color: var(--muted);
      min-width: 45px;
      text-align: right;
    }
    .actions {
      display: flex;
      gap: 0.4rem;
      align-items: center;
    }
    button {
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 6px;
      padding: 0.35rem 0.6rem;
      font-size: 0.75rem;
      cursor: pointer;
      font-family: inherit;
    }

    /* Overlay "Livres" pleine largeur */
    .books-overlay {
      position: fixed;
      top: 50px;
      left: 0;
      right: 0;
      bottom: 0;
      background: var(--overlay-bg);
      z-index: 40;
      display: none;
      padding: 0.5rem;
      overflow-y: auto;
    }
    .books-overlay.active {
      display: block;
    }
    .books-panel {
      background: var(--card);
      border-radius: 8px;
      padding: 0.6rem;
      max-height: 80vh;
      overflow-y: auto;
    }
    .books-section-title {
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--muted);
      margin: 0.6rem 0.4rem 0.25rem;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    .books-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(2.8rem, 1fr));
      gap: 0.4rem;
    }
    .book-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.4rem 0.2rem;
      font-size: 0.75rem;
      user-select: none;
      cursor: pointer;
      background: var(--card);
      color: var(--text);
      text-align: center;
      font-family: inherit;
    }
    .book-btn:hover {
      background: var(--accent-weak);
      color: var(--accent);
      border-color: var(--accent);
    }

    .container {
      padding: 1rem;
      max-width: 900px;
      margin: 0 auto;
    }
    h2 {
      font-size: 1.05rem;
      font-weight: 700;
      margin: 0.9rem 0 0.35rem;
    }

    /* Livre */
    .book {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.55rem;
      margin-bottom: 0.65rem;
      scroll-margin-top: 60px;
    }
    .book-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.35rem;
      cursor: pointer;
      user-select: none;
    }
    .book-title {
      font-weight: 600;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .book-complete-mark {
      color: var(--success);
      font-weight: 700;
      font-size: 1rem;
    }
    .book-progress {
      font-size: 0.65rem;
      color: var(--muted);
    }
    .chapters {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(2rem, 1fr));
      gap: 0.25rem;
    }
    .chapter {
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.25rem 0;
      font-size: 0.8rem;
      font-weight: 500;
      text-align: center;
      cursor: pointer;
      background: var(--card);
      color: var(--text);
    }
    .chapter.checked {
      background: var(--accent-weak);
      border-color: var(--accent);
      color: var(--accent);
      font-weight: 600;
    }

    /* Livre compacté (terminé) */
    .book.compact .chapters {
      display: none;
    }
    .book.compact {
      padding: 0.4rem 0.55rem;
    }

    /* Bouton Réinitialiser en bas */
    .reset-section {
      max-width: 900px;
      margin: 1.2rem auto 2rem;
      padding: 0 1rem;
      text-align: center;
    }
    .reset-button {
      background: #dc2626;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 0.5rem 1rem;
      font-size: 0.85rem;
      cursor: pointer;
      font-family: inherit;
    }

    /* Modal reset (3 étapes) */
    .reset-modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 50;
    }
    .reset-modal.active {
      display: flex;
    }
    .reset-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.9rem;
      max-width: 340px;
      width: 90%;
    }
    .reset-card h2 {
      font-size: 0.95rem;
      margin: 0 0 0.4rem;
    }
    .reset-card p {
      font-size: 0.85rem;
      color: var(--muted);
      margin: 0 0 0.6rem;
    }
    .reset-actions {
      display: flex;
      gap: 0.4rem;
      justify-content: flex-end;
    }
    .reset-actions button.secondary {
      background: transparent;
      color: var(--accent);
      border: 1px solid var(--accent);
    }
  </style>
</head>
<body>
  <header>
    <div style="display:flex;align-items:center;gap:0.4rem;flex-wrap:wrap;">
      <button id="menuToggle">Livres</button>
      <h1>Suivi de lecture de la Bible</h1>
    </div>
    <div class="progress-wrap">
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="progress-text" id="progressText">0%</div>
    </div>
    <div class="actions"></div>
  </header>

  <!-- Overlay "Livres" -->
  <div class="books-overlay" id="booksOverlay">
    <div class="books-panel">
      <div id="booksPanelContent"></div>
    </div>
  </div>

  <div class="container" id="app"></div>

  <!-- Bouton Réinitialiser -->
  <div class="reset-section">
    <button class="reset-button" id="resetBtn">Réinitialiser</button>
  </div>

  <!-- Modal reset (3 étapes) -->
  <div class="reset-modal" id="resetModal">
    <div class="reset-card">
      <h2 id="resetTitle">Réinitialiser la progression ?</h2>
      <p id="resetText">Toutes les cases seront décochées. Cette action est réversible uniquement en cochant à nouveau les chapitres.</p>
      <div class="reset-actions" id="resetActions1">
        <button class="secondary" id="resetCancel1">Annuler</button>
        <button id="resetNext1">Continuer</button>
      </div>
      <div class="reset-actions" id="resetActions2" style="display:none;">
        <button class="secondary" id="resetCancel2">Retour</button>
        <button id="resetNext2">Continuer</button>
      </div>
      <div class="reset-actions" id="resetActions3" style="display:none;">
        <button class="secondary" id="resetCancel3">Retour</button>
        <button id="resetConfirm3">Réinitialiser la progression</button>
      </div>
    </div>
  </div>

  <script>
    const bible = [
      {
        section: "Ancien Testament",
        books: [
          { name: "Genèse", abbr: "Gen", chapters: 50 },
          { name: "Exode", abbr: "Ex", chapters: 40 },
          { name: "Lévitique", abbr: "Lé", chapters: 27 },
          { name: "Nombres", abbr: "Nb", chapters: 36 },
          { name: "Deutéronome", abbr: "Dt", chapters: 34 },
          { name: "Josué", abbr: "Jos", chapters: 24 },
          { name: "Juges", abbr: "Jg", chapters: 21 },
          { name: "Ruth", abbr: "Rt", chapters: 4 },
          { name: "1 Samuel", abbr: "1 S", chapters: 31 },
          { name: "2 Samuel", abbr: "2 S", chapters: 24 },
          { name: "1 Rois", abbr: "1 R", chapters: 22 },
          { name: "2 Rois", abbr: "2 R", chapters: 25 },
          { name: "1 Chroniques", abbr: "1 Ch", chapters: 29 },
          { name: "2 Chroniques", abbr: "2 Ch", chapters: 36 },
          { name: "Esdras", abbr: "Es", chapters: 10 },
          { name: "Néhémie", abbr: "Ne", chapters: 13 },
          { name: "Esther", abbr: "Est", chapters: 10 },
          { name: "Job", abbr: "Jb", chapters: 42 },
          { name: "Psaumes", abbr: "Ps", chapters: 150 },
          { name: "Proverbes", abbr: "Pr", chapters: 31 },
          { name: "Ecclésiaste", abbr: "Ec", chapters: 12 },
          { name: "Cantique des cantiques", abbr: "Ct", chapters: 8 },
          { name: "Ésaïe", abbr: "És", chapters: 66 },
          { name: "Jérémie", abbr: "Jr", chapters: 52 },
          { name: "Lamentations", abbr: "Lm", chapters: 5 },
          { name: "Ézéchiel", abbr: "Éz", chapters: 48 },
          { name: "Daniel", abbr: "Dn", chapters: 12 },
          { name: "Osée", abbr: "Os", chapters: 14 },
          { name: "Joël", abbr: "Jl", chapters: 3 },
          { name: "Amos", abbr: "Am", chapters: 9 },
          { name: "Abdias", abbr: "Ab", chapters: 1 },
          { name: "Jonas", abbr: "Jon", chapters: 4 },
          { name: "Michée", abbr: "Mi", chapters: 7 },
          { name: "Nahum", abbr: "Na", chapters: 3 },
          { name: "Habacuc", abbr: "Ha", chapters: 3 },
          { name: "Sophonie", abbr: "So", chapters: 3 },
          { name: "Aggée", abbr: "Ag", chapters: 2 },
          { name: "Zacharie", abbr: "Za", chapters: 14 },
          { name: "Malachie", abbr: "Ml", chapters: 4 }
        ]
      },
      {
        section: "Nouveau Testament",
        books: [
          { name: "Matthieu", abbr: "Mt", chapters: 28 },
          { name: "Marc", abbr: "Mc", chapters: 16 },
          { name: "Luc", abbr: "Lc", chapters: 24 },
          { name: "Jean", abbr: "Jn", chapters: 21 },
          { name: "Actes des apôtres", abbr: "Act", chapters: 28 },
          { name: "Romains", abbr: "Rm", chapters: 16 },
          { name: "1 Corinthiens", abbr: "1 Co", chapters: 16 },
          { name: "2 Corinthiens", abbr: "2 Co", chapters: 13 },
          { name: "Galates", abbr: "Ga", chapters: 6 },
          { name: "Éphésiens", abbr: "Ép", chapters: 6 },
          { name: "Philippiens", abbr: "Ph", chapters: 4 },
          { name: "Colossiens", abbr: "Col", chapters: 4 },
          { name: "1 Thessaloniciens", abbr: "1 Th", chapters: 5 },
          { name: "2 Thessaloniciens", abbr: "2 Th", chapters: 3 },
          { name: "1 Timothée", abbr: "1 Tm", chapters: 6 },
          { name: "2 Timothée", abbr: "2 Tm", chapters: 4 },
          { name: "Tite", abbr: "Tt", chapters: 3 },
          { name: "Philémon", abbr: "Phm", chapters: 1 },
          { name: "Hébreux", abbr: "He", chapters: 13 },
          { name: "Jacques", abbr: "Jc", chapters: 5 },
          { name: "1 Pierre", abbr: "1 P", chapters: 5 },
          { name: "2 Pierre", abbr: "2 P", chapters: 3 },
          { name: "1 Jean", abbr: "1 Jn", chapters: 5 },
          { name: "2 Jean", abbr: "2 Jn", chapters: 1 },
          { name: "3 Jean", abbr: "3 Jn", chapters: 1 },
          { name: "Jude", abbr: "Jude", chapters: 1 },
          { name: "Apocalypse", abbr: "Ap", chapters: 22 }
        ]
      }
    ];

    const STORAGE_KEY = "bibleProgress_finale_complete_v1";

    // État "ouvert/fermé" des livres (non persisté, reset à chaque rechargement)
    const bookOpenState = {};

    function loadProgress() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return {};
        const data = JSON.parse(raw);
        if (typeof data !== "object" || data === null) return {};
        return data;
      } catch {
        return {};
      }
    }

    function saveProgress(data) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }

    function chapterKey(bookName, chapterNumber) {
      return `${bookName}:${chapterNumber}`;
    }

    function slugify(str) {
      return str
        .toLowerCase()
        .replace(/[^a-z0-9à-ÿ]+/g, "-")
        .replace(/^-+|-+$/g, "");
    }

    function render() {
      const progress = loadProgress();
      const app = document.getElementById("app");
      const booksPanelContent = document.getElementById("booksPanelContent");

      app.innerHTML = "";

      let totalChapters = 0;
      let checkedChapters = 0;

      // Remplir l'overlay UNE SEULE FOIS
      if (booksPanelContent.innerHTML.trim() === "") {
        for (const section of bible) {
          const sectionTitle = document.createElement("div");
          sectionTitle.className = "books-section-title";
          sectionTitle.textContent = section.section;
          booksPanelContent.appendChild(sectionTitle);

          const booksGrid = document.createElement("div");
          booksGrid.className = "books-grid";

          for (const book of section.books) {
            const btn = document.createElement("button");
            btn.className = "book-btn";
            btn.textContent = book.abbr;
            btn.title = book.name;
            btn.addEventListener("click", () => {
              document.getElementById("booksOverlay").classList.remove("active");
              const el = document.getElementById(`book-${slugify(book.name)}`);
              if (el) {
                el.scrollIntoView({ behavior: "smooth", block: "start" });
              }
            });
            booksGrid.appendChild(btn);
          }

          booksPanelContent.appendChild(booksGrid);
        }
      }

      // Livres + chapitres
      for (const section of bible) {
        const sectionTitle = document.createElement("h2");
        sectionTitle.textContent = section.section;
        app.appendChild(sectionTitle);

        for (const book of section.books) {
          const bookKey = slugify(book.name);

          // Initialiser l'état ouvert/fermé si besoin
          if (bookOpenState[bookKey] === undefined) {
            bookOpenState[bookKey] = true; // ouvert par défaut
          }

          const bookDiv = document.createElement("div");
          bookDiv.className = "book";
          bookDiv.id = `book-${bookKey}`;

          // Calculer si le livre est complet
          let bookChecked = 0;
          for (let c = 1; c <= book.chapters; c++) {
            const key = chapterKey(book.name, c);
            if (progress[key]) bookChecked++;
          }
          const isComplete = bookChecked === book.chapters;

          // Si le livre est complet et fermé, on applique la classe compact
          if (isComplete && !bookOpenState[bookKey]) {
            bookDiv.classList.add("compact");
          }

          const header = document.createElement("div");
          header.className = "book-header";
          header.addEventListener("click", () => {
            // Basculer ouvert/fermé seulement si le livre est complet
            if (isComplete) {
              bookOpenState[bookKey] = !bookOpenState[bookKey];
              render();
            }
          });

          const title = document.createElement("div");
          title.className = "book-title";
          let titleHTML = `${book.name} (${book.abbr})`;
          if (isComplete) {
            titleHTML += ` <span class="book-complete-mark">✓</span>`;
          }
          title.innerHTML = titleHTML;
          header.appendChild(title);

          const bookProgress = document.createElement("div");
          bookProgress.className = "book-progress";
          bookProgress.textContent = `${bookChecked}/${book.chapters}`;
          header.appendChild(bookProgress);

          bookDiv.appendChild(header);

          const chaptersGrid = document.createElement("div");
          chaptersGrid.className = "chapters";

          for (let c = 1; c <= book.chapters; c++) {
            const key = chapterKey(book.name, c);
            const btn = document.createElement("button");
            btn.className = "chapter";

            // Affichage explicite du numéro
            btn.textContent = String(c);

            if (progress[key]) {
              btn.classList.add("checked");
              checkedChapters++;
            }

            btn.addEventListener("click", () => {
              const current = loadProgress();
              if (current[key]) {
                delete current[key];
              } else {
                current[key] = true;
              }
              saveProgress(current);
              render();
            });

            chaptersGrid.appendChild(btn);
            totalChapters++;
          }

          bookDiv.appendChild(chaptersGrid);
          app.appendChild(bookDiv);
        }
      }

      const percent = totalChapters === 0 ? 0 : Math.round((checkedChapters / totalChapters) * 100);
      document.getElementById("progressFill").style.width = percent + "%";
      document.getElementById("progressText").textContent = percent + "%";
    }

    // Overlay "Livres"
    const menuToggle = document.getElementById("menuToggle");
    const booksOverlay = document.getElementById("booksOverlay");

    menuToggle.addEventListener("click", () => {
      booksOverlay.classList.add("active");
    });

    booksOverlay.addEventListener("click", (e) => {
      if (e.target === booksOverlay) {
        booksOverlay.classList.remove("active");
      }
    });

    // Reset modal (3 étapes)
    const resetBtn = document.getElementById("resetBtn");
    const resetModal = document.getElementById("resetModal");
    const resetTitle = document.getElementById("resetTitle");
    const resetText = document.getElementById("resetText");
    const resetActions1 = document.getElementById("resetActions1");
    const resetActions2 = document.getElementById("resetActions2");
    const resetActions3 = document.getElementById("resetActions3");
    const resetCancel1 = document.getElementById("resetCancel1");
    const resetNext1 = document.getElementById("resetNext1");
    const resetCancel2 = document.getElementById("resetCancel2");
    const resetNext2 = document.getElementById("resetNext2");
    const resetCancel3 = document.getElementById("resetCancel3");
    const resetConfirm3 = document.getElementById("resetConfirm3");

    resetBtn.addEventListener("click", () => {
      resetTitle.textContent = "Réinitialiser la progression ?";
      resetText.textContent = "Toutes les cases seront décochées. Cette action est réversible uniquement en cochant à nouveau les chapitres.";
      resetActions1.style.display = "flex";
      resetActions2.style.display = "none";
      resetActions3.style.display = "none";
      resetModal.classList.add("active");
    });

    resetCancel1.addEventListener("click", () => {
      resetModal.classList.remove("active");
    });

    resetNext1.addEventListener("click", () => {
      resetTitle.textContent = "Êtes‑vous sûr ?";
      resetText.textContent = "Toute ta progression sera effacée. Es‑tu certain de vouloir continuer ?";
      resetActions1.style.display = "none";
      resetActions2.style.display = "flex";
      resetActions3.style.display = "none";
    });

    resetCancel2.addEventListener("click", () => {
      resetTitle.textContent = "Réinitialiser la progression ?";
      resetText.textContent = "Toutes les cases seront décochées. Cette action est réversible uniquement en cochant à nouveau les chapitres.";
      resetActions1.style.display = "flex";
      resetActions2.style.display = "none";
      resetActions3.style.display = "none";
    });

    resetNext2.addEventListener("click", () => {
      resetTitle.textContent = "Vraiment sûr ?";
      resetText.textContent = "Ceci est la dernière confirmation. Toute ta progression sera définitivement effacée.";
      resetActions1.style.display = "none";
      resetActions2.style.display = "none";
      resetActions3.style.display = "flex";
    });

    resetCancel3.addEventListener("click", () => {
      resetTitle.textContent = "Êtes‑vous sûr ?";
      resetText.textContent = "Toute ta progression sera effacée. Es‑tu certain de vouloir continuer ?";
      resetActions1.style.display = "none";
      resetActions2.style.display = "flex";
      resetActions3.style.display = "none";
    });

    resetConfirm3.addEventListener("click", () => {
      // Effacer la progression
      localStorage.removeItem(STORAGE_KEY);

      // Réouvrir toutes les boîtes
      for (const key of Object.keys(bookOpenState)) {
        bookOpenState[key] = true;
      }

      resetModal.classList.remove("active");
      render();
    });

    // Initial render
    render();
  </script>
</body>
</html>
