<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Test Bible – Numéros</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f7;
      color: #222;
      margin: 0;
      padding: 1rem;
    }
    h1 {
      font-size: 1.1rem;
      margin: 0 0 1rem;
    }
    .book {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 0.6rem;
      margin-bottom: 0.8rem;
    }
    .book-title {
      font-weight: 600;
      margin-bottom: 0.4rem;
    }
    .chapters {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(2rem, 1fr));
      gap: 0.3rem;
    }
    .chapter {
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 0.25rem 0;
      font-size: 0.8rem;
      font-weight: 500;
      text-align: center;
      cursor: pointer;
      background: #fff;
      color: #222;
    }
    .chapter.checked {
      background: #dbeafe;
      border-color: #2563eb;
      color: #2563eb;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <h1>Test Bible – Genèse et Matthieu</h1>
  <div id="app"></div>

  <script>
    const books = [
      { name: "Genèse", chapters: 50 },
      { name: "Matthieu", chapters: 28 }
    ];

    const STORAGE_KEY = "bibleTestProgress_v2";

    function loadProgress() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return {};
        const data = JSON.parse(raw);
        if (typeof data !== "object" || data === null) return {};
        return data;
      } catch {
        return {};
      }
    }

    function saveProgress(data) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }

    function chapterKey(bookName, chapterNumber) {
      return `${bookName}:${chapterNumber}`;
    }

    function render() {
      const progress = loadProgress();
      const app = document.getElementById("app");
      app.innerHTML = "";

      for (const book of books) {
        const bookDiv = document.createElement("div");
        bookDiv.className = "book";

        const title = document.createElement("div");
        title.className = "book-title";
        title.textContent = book.name;
        bookDiv.appendChild(title);

        const chaptersGrid = document.createElement("div");
        chaptersGrid.className = "chapters";

        for (let c = 1; c <= book.chapters; c++) {
          const key = chapterKey(book.name, c);
          const btn = document.createElement("button");
          btn.className = "chapter";

          // Affichage explicite du numéro
          btn.textContent = String(c);

          if (progress[key]) {
            btn.classList.add("checked");
          }

          btn.addEventListener("click", () => {
            const current = loadProgress();
            if (current[key]) {
              delete current[key];
            } else {
              current[key] = true;
            }
            saveProgress(current);
            render();
          });

          chaptersGrid.appendChild(btn);
        }

        bookDiv.appendChild(chaptersGrid);
        app.appendChild(bookDiv);
      }
    }

    render();
  </script>
</body>
</html>
