<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Suivi de lecture de la Bible</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --bg: #f7f7f9;
      --card: #ffffff;
      --text: #222;
      --muted: #666;
      --accent: #2563eb;
      --accent-weak: #dbeafe;
      --border: #e5e7eb;
      --success: #16a34a;
      --sidebar-bg: #f3f4f6;
      --overlay-bg: rgba(0,0,0,0.6);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b0f14;
        --card: #111827;
        --text: #e5e7eb;
        --muted: #9ca3af;
        --accent: #60a5fa;
        --accent-weak: #1e3a8a;
        --border: #1f2937;
        --success: #22c55e;
        --sidebar-bg: #0f172a;
      }
    }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.35;
    }

    /* Header */
    header {
      position: sticky;
      top: 0;
      z-index: 30;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      padding: 0.6rem 0.75rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      align-items: center;
      justify-content: space-between;
    }
    header h1 {
      font-size: 0.95rem;
      margin: 0;
      font-weight: 600;
    }
    .progress-wrap {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex: 1;
      min-width: 140px;
    }
    .progress-bar {
      flex: 1;
      height: 8px;
      background: var(--border);
      border-radius: 999px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: var(--success);
      width: 0%;
      transition: width 0.25s ease;
    }
    .progress-text {
      font-size: 0.7rem;
      color: var(--muted);
      min-width: 45px;
      text-align: right;
    }
    .actions {
      display: flex;
      gap: 0.4rem;
      flex-wrap: wrap;
      align-items: center;
    }
    button {
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 6px;
      padding: 0.35rem 0.6rem;
      font-size: 0.75rem;
      cursor: pointer;
    }
    button.secondary {
      background: transparent;
      color: var(--accent);
      border: 1px solid var(--accent);
    }
    #menuToggle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 2.2rem;
    }

    /* Layout principal avec sidebar */
    .layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0;
    }
    @media (min-width: 900px) {
      .layout {
        grid-template-columns: 1fr 220px;
      }
    }

    main {
      padding: 0.6rem;
      max-width: 900px;
      margin: 0 auto;
      width: 100%;
    }

    /* Sidebar de navigation (desktop) */
    aside {
      background: var(--sidebar-bg);
      border-left: 1px solid var(--border);
      padding: 0.6rem 0.5rem;
      position: sticky;
      top: 50px; /* hauteur approx du header */
      height: calc(100vh - 50px);
      overflow-y: auto;
      display: none;
    }
    @media (min-width: 900px) {
      aside {
        display: block;
      }
    }
    .nav-section-title {
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--muted);
      margin: 0.6rem 0.4rem 0.2rem;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    .nav-list {
      list-style: none;
      margin: 0;
      padding: 0;
    }
    .nav-item {
      margin: 0;
    }
    .nav-link {
      display: block;
      padding: 0.25rem 0.4rem;
      font-size: 0.75rem;
      color: var(--text);
      text-decoration: none;
      border-radius: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .nav-link:hover {
      background: var(--accent-weak);
      color: var(--accent);
    }

    /* Overlay menu mobile */
    .mobile-menu-overlay {
      position: fixed;
      inset: 0;
      background: var(--overlay-bg);
      z-index: 40;
      display: none;
      align-items: stretch;
      justify-content: flex-end;
    }
    .mobile-menu-overlay.active {
      display: flex;
    }
    .mobile-menu {
      background: var(--card);
      width: min(85vw, 320px);
      height: 100%;
      overflow-y: auto;
      padding: 0.75rem 0.5rem;
      box-shadow: -2px 0 8px rgba(0,0,0,0.25);
    }
    .mobile-menu-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 0.25rem 0.4rem;
      border-bottom: 1px solid var(--border);
      margin-bottom: 0.4rem;
    }
    .mobile-menu-title {
      font-weight: 700;
      font-size: 0.9rem;
    }
    .mobile-close {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
      font-size: 0.75rem;
      padding: 0.25rem 0.5rem;
    }

    /* Livres et chapitres */
    .section-title {
      font-size: 1.05rem;
      font-weight: 700;
      margin: 0.9rem 0 0.35rem;
    }
    .book {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.55rem;
      margin-bottom: 0.65rem;
      scroll-margin-top: 60px;
    }
    .book-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.35rem;
    }
    .book-title {
      font-weight: 600;
      font-size: 0.9rem;
    }
    .book-progress {
      font-size: 0.65rem;
      color: var(--muted);
    }
    .chapters {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(1.9rem, 1fr));
      gap: 0.25rem;
    }
    .chapter {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.18rem 0;
      font-size: 0.7rem;
      user-select: none;
      cursor: pointer;
      background: var(--card);
      color: var(--text);
      text-decoration: none;
    }
    .chapter.checked {
      background: var(--accent-weak);
      border-color: var(--accent);
      color: var(--accent);
      font-weight: 600;
    }

    /* Modal reset */
    .reset-modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 50;
    }
    .reset-modal.active {
      display: flex;
    }
    .reset-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.9rem;
      max-width: 320px;
      width: 90%;
    }
    .reset-card h2 {
      font-size: 0.95rem;
      margin: 0 0 0.4rem;
    }
    .reset-card p {
      font-size: 0.85rem;
      color: var(--muted);
      margin: 0 0 0.6rem;
    }
    .reset-actions {
      display: flex;
      gap: 0.4rem;
      justify-content: flex-end;
    }
  </style>
</head>
<body>
  <header>
    <div style="display:flex;align-items:center;gap:0.4rem;flex-wrap:wrap;">
      <button id="menuToggle">Livres</button>
      <h1>Suivi de lecture de la Bible</h1>
    </div>
    <div class="progress-wrap">
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="progress-text" id="progressText">0%</div>
    </div>
    <div class="actions">
      <button id="resetBtn" class="secondary">Recommencer</button>
    </div>
  </header>

  <div class="layout">
    <main id="app"></main>

    <aside id="sidebar">
      <!-- Rempli dynamiquement (desktop) -->
    </aside>
  </div>

  <!-- Overlay menu mobile -->
  <div class="mobile-menu-overlay" id="mobileMenuOverlay">
    <div class="mobile-menu">
      <div class="mobile-menu-header">
        <div class="mobile-menu-title">Livres de la Bible</div>
        <button class="mobile-close" id="mobileMenuClose">Fermer</button>
      </div>
      <div id="mobileMenuContent">
        <!-- Rempli dynamiquement -->
      </div>
    </div>
  </div>

  <!-- Modal reset -->
  <div class="reset-modal" id="resetModal">
    <div class="reset-card">
      <h2>Recommencer un cycle ?</h2>
      <p>Toutes les cases seront décochées. Cette action est réversible uniquement en cochant à nouveau les chapitres.</p>
      <div class="reset-actions">
        <button class="secondary" id="cancelReset">Annuler</button>
        <button id="confirmReset">Tout décocher</button>
      </div>
    </div>
  </div>

  <script>
    // Structure de la Bible avec abréviations françaises usuelles
    const bible = [
      {
        section: "Ancien Testament",
        books: [
          { name: "Genèse", abbr: "Gen", chapters: 50 },
          { name: "Exode", abbr: "Ex", chapters: 40 },
          { name: "Lévitique", abbr: "Lé", chapters: 27 },
          { name: "Nombres", abbr: "Nb", chapters: 36 },
          { name: "Deutéronome", abbr: "Dt", chapters: 34 },
          { name: "Josué", abbr: "Jos", chapters: 24 },
          { name: "Juges", abbr: "Jg", chapters: 21 },
          { name: "Ruth", abbr: "Rt", chapters: 4 },
          { name: "1 Samuel", abbr: "1 S", chapters: 31 },
          { name: "2 Samuel", abbr: "2 S", chapters: 24 },
          { name: "1 Rois", abbr: "1 R", chapters: 22 },
          { name: "2 Rois", abbr: "2 R", chapters: 25 },
          { name: "1 Chroniques", abbr: "1 Ch", chapters: 29 },
          { name: "2 Chroniques", abbr: "2 Ch", chapters: 36 },
          { name: "Esdras", abbr: "Es", chapters: 10 },
          { name: "Néhémie", abbr: "Ne", chapters: 13 },
          { name: "Esther", abbr: "Est", chapters: 10 },
          { name: "Job", abbr: "Jb", chapters: 42 },
          { name: "Psaumes", abbr: "Ps", chapters: 150 },
          { name: "Proverbes", abbr: "Pr", chapters: 31 },
          { name: "Ecclésiaste", abbr: "Ec", chapters: 12 },
          { name: "Cantique des cantiques", abbr: "Ct", chapters: 8 },
          { name: "Ésaïe", abbr: "És", chapters: 66 },
          { name: "Jérémie", abbr: "Jr", chapters: 52 },
          { name: "Lamentations", abbr: "Lm", chapters: 5 },
          { name: "Ézéchiel", abbr: "Éz", chapters: 48 },
          { name: "Daniel", abbr: "Dn", chapters: 12 },
          { name: "Osée", abbr: "Os", chapters: 14 },
          { name: "Joël", abbr: "Jl", chapters: 3 },
          { name: "Amos", abbr: "Am", chapters: 9 },
          { name: "Abdias", abbr: "Ab", chapters: 1 },
          { name: "Jonas", abbr: "Jon", chapters: 4 },
          { name: "Michée", abbr: "Mi", chapters: 7 },
          { name: "Nahum", abbr: "Na", chapters: 3 },
          { name: "Habacuc", abbr: "Ha", chapters: 3 },
          { name: "Sophonie", abbr: "So", chapters: 3 },
          { name: "Aggée", abbr: "Ag", chapters: 2 },
          { name: "Zacharie", abbr: "Za", chapters: 14 },
          { name: "Malachie", abbr: "Ml", chapters: 4 }
        ]
      },
      {
        section: "Nouveau Testament",
        books: [
          { name: "Matthieu", abbr: "Mt", chapters: 28 },
          { name: "Marc", abbr: "Mc", chapters: 16 },
          { name: "Luc", abbr: "Lc", chapters: 24 },
          { name: "Jean", abbr: "Jn", chapters: 21 },
          { name: "Actes des apôtres", abbr: "Act", chapters: 28 },
          { name: "Romains", abbr: "Rm", chapters: 16 },
          { name: "1 Corinthiens", abbr: "1 Co", chapters: 16 },
          { name: "2 Corinthiens", abbr: "2 Co", chapters: 13 },
          { name: "Galates", abbr: "Ga", chapters: 6 },
          { name: "Éphésiens", abbr: "Ép", chapters: 6 },
          { name: "Philippiens", abbr: "Ph", chapters: 4 },
          { name: "Colossiens", abbr: "Col", chapters: 4 },
          { name: "1 Thessaloniciens", abbr: "1 Th", chapters: 5 },
          { name: "2 Thessaloniciens", abbr: "2 Th", chapters: 3 },
          { name: "1 Timothée", abbr: "1 Tm", chapters: 6 },
          { name: "2 Timothée", abbr: "2 Tm", chapters: 4 },
          { name: "Tite", abbr: "Tt", chapters: 3 },
          { name: "Philémon", abbr: "Phm", chapters: 1 },
          { name: "Hébreux", abbr: "He", chapters: 13 },
          { name: "Jacques", abbr: "Jc", chapters: 5 },
          { name: "1 Pierre", abbr: "1 P", chapters: 5 },
          { name: "2 Pierre", abbr: "2 P", chapters: 3 },
          { name: "1 Jean", abbr: "1 Jn", chapters: 5 },
          { name: "2 Jean", abbr: "2 Jn", chapters: 1 },
          { name: "3 Jean", abbr: "3 Jn", chapters: 1 },
          { name: "Jude", abbr: "Jude", chapters: 1 },
          { name: "Apocalypse", abbr: "Ap", chapters: 22 }
        ]
      }
    ];

    const STORAGE_KEY = "bibleProgress_v3";

    function loadProgress() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return {};
        const data = JSON.parse(raw);
        if (typeof data !== "object" || data === null) return {};
        return data;
      } catch {
        return {};
      }
    }

    function saveProgress(data) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }

    function chapterKey(bookName, chapterNumber) {
      return `${bookName}:${chapterNumber}`;
    }

    function render() {
      const progress = loadProgress();
      const app = document.getElementById("app");
      const sidebar = document.getElementById("sidebar");
      const mobileMenuContent = document.getElementById("mobileMenuContent");

      app.innerHTML = "";
      sidebar.innerHTML = "";
      mobileMenuContent.innerHTML = "";

      let totalChapters = 0;
      let checkedChapters = 0;

      // Construire sidebar (desktop) et menu mobile
      for (const section of bible) {
        // Sidebar
        const sectionTitleSide = document.createElement("div");
        sectionTitleSide.className = "nav-section-title";
        sectionTitleSide.textContent = section.section;
        sidebar.appendChild(sectionTitleSide);

        const navListSide = document.createElement("ul");
        navListSide.className = "nav-list";

        // Mobile menu
        const sectionTitleMobile = document.createElement("div");
        sectionTitleMobile.className = "nav-section-title";
        sectionTitleMobile.textContent = section.section;
        mobileMenuContent.appendChild(sectionTitleMobile);

        const navListMobile = document.createElement("ul");
        navListMobile.className = "nav-list";

        for (const book of section.books) {
          // Sidebar link
          const navItemSide = document.createElement("li");
          navItemSide.className = "nav-item";
          const navLinkSide = document.createElement("a");
          navLinkSide.className = "nav-link";
          navLinkSide.href = `#book-${slugify(book.name)}`;
          navLinkSide.textContent = book.abbr;
          navLinkSide.title = book.name;
          navItemSide.appendChild(navLinkSide);
          navListSide.appendChild(navItemSide);

          // Mobile link
          const navItemMobile = document.createElement("li");
          navItemMobile.className = "nav-item";
          const navLinkMobile = document.createElement("a");
          navLinkMobile.className = "nav-link";
          navLinkMobile.href = `#book-${slugify(book.name)}`;
          navLinkMobile.textContent = book.abbr;
          navLinkMobile.title = book.name;
          navLinkMobile.addEventListener("click", () => {
            // Fermer le menu après sélection
            document.getElementById("mobileMenuOverlay").classList.remove("active");
          });
          navItemMobile.appendChild(navLinkMobile);
          navListMobile.appendChild(navItemMobile);
        }

        sidebar.appendChild(navListSide);
        mobileMenuContent.appendChild(navListMobile);
      }

      // Contenu principal (livres + chapitres)
      for (const section of bible) {
        const sectionTitle = document.createElement("h2");
        sectionTitle.className = "section-title";
        sectionTitle.textContent = section.section;
        app.appendChild(sectionTitle);

        for (const book of section.books) {
          const bookDiv = document.createElement("div");
          bookDiv.className = "book";
          bookDiv.id = `book-${slugify(book.name)}`;

          const header = document.createElement("div");
          header.className = "book-header";

          const title = document.createElement("div");
          title.className = "book-title";
          title.textContent = `${book.name} (${book.abbr})`;

          const bookProgress = document.createElement("div");
          bookProgress.className = "book-progress";

          let bookChecked = 0;
          for (let c = 1; c <= book.chapters; c++) {
            const key = chapterKey(book.name, c);
            if (progress[key]) bookChecked++;
          }

          bookProgress.textContent = `${bookChecked}/${book.chapters}`;
          header.appendChild(title);
          header.appendChild(bookProgress);
          bookDiv.appendChild(header);

          const chaptersGrid = document.createElement("div");
          chaptersGrid.className = "chapters";

          for (let c = 1; c <= book.chapters; c++) {
            const key = chapterKey(book.name, c);
            const btn = document.createElement("button");
            btn.className = "chapter";
            if (progress[key]) {
              btn.classList.add("checked");
              checkedChapters++;
            }
            btn.textContent = c;
            btn.addEventListener("click", () => {
              const current = loadProgress();
              if (current[key]) {
                delete current[key];
              } else {
                current[key] = true;
              }
              saveProgress(current);
              render();
            });
            chaptersGrid.appendChild(btn);
            totalChapters++;
          }

          bookDiv.appendChild(chaptersGrid);
          app.appendChild(bookDiv);
        }
      }

      const percent = totalChapters === 0 ? 0 : Math.round((checkedChapters / totalChapters) * 100);
      document.getElementById("progressFill").style.width = percent + "%";
      document.getElementById("progressText").textContent = percent + "%";
    }

    function slugify(str) {
      return str
        .toLowerCase()
        .replace(/[^a-z0-9à-ÿ]+/g, "-")
        .replace(/^-+|-+$/g, "");
    }

    // Reset modal logic
    const resetBtn = document.getElementById("resetBtn");
    const resetModal = document.getElementById("resetModal");
    const cancelReset = document.getElementById("cancelReset");
    const confirmReset = document.getElementById("confirmReset");

    resetBtn.addEventListener("click", () => {
      resetModal.classList.add("active");
    });

    cancelReset.addEventListener("click", () => {
      resetModal.classList.remove("active");
    });

    confirmReset.addEventListener("click", () => {
      localStorage.removeItem(STORAGE_KEY);
      resetModal.classList.remove("active");
      render();
    });

    // Menu mobile
    const menuToggle = document.getElementById("menuToggle");
    const mobileMenuOverlay = document.getElementById("mobileMenuOverlay");
    const mobileMenuClose = document.getElementById("mobileMenuClose");

    menuToggle.addEventListener("click", () => {
      mobileMenuOverlay.classList.add("active");
    });

    mobileMenuClose.addEventListener("click", () => {
      mobileMenuOverlay.classList.remove("active");
    });

    mobileMenuOverlay.addEventListener("click", (e) => {
      // Fermer si on clique en dehors du menu
      if (e.target === mobileMenuOverlay) {
        mobileMenuOverlay.classList.remove("active");
      }
    });

    // Initial render
    render();
  </script>
</body>
</html>
