<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Bible – Tous les livres (simple)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f7;
      color: #222;
      margin: 0;
      padding: 1rem;
    }
    h1 {
      font-size: 1.1rem;
      margin: 0 0 1rem;
    }
    h2 {
      font-size: 1rem;
      margin: 1rem 0 0.5rem;
    }
    .book {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 0.6rem;
      margin-bottom: 0.8rem;
    }
    .book-title {
      font-weight: 600;
      margin-bottom: 0.4rem;
    }
    .chapters {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(2rem, 1fr));
      gap: 0.3rem;
    }
    .chapter {
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 0.25rem 0;
      font-size: 0.8rem;
      font-weight: 500;
      text-align: center;
      cursor: pointer;
      background: #fff;
      color: #222;
    }
    .chapter.checked {
      background: #dbeafe;
      border-color: #2563eb;
      color: #2563eb;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <h1>Suivi de lecture de la Bible – Tous les livres</h1>
  <div id="app"></div>

  <script>
    const bible = [
      {
        section: "Ancien Testament",
        books: [
          { name: "Genèse", abbr: "Gen", chapters: 50 },
          { name: "Exode", abbr: "Ex", chapters: 40 },
          { name: "Lévitique", abbr: "Lé", chapters: 27 },
          { name: "Nombres", abbr: "Nb", chapters: 36 },
          { name: "Deutéronome", abbr: "Dt", chapters: 34 },
          { name: "Josué", abbr: "Jos", chapters: 24 },
          { name: "Juges", abbr: "Jg", chapters: 21 },
          { name: "Ruth", abbr: "Rt", chapters: 4 },
          { name: "1 Samuel", abbr: "1 S", chapters: 31 },
          { name: "2 Samuel", abbr: "2 S", chapters: 24 },
          { name: "1 Rois", abbr: "1 R", chapters: 22 },
          { name: "2 Rois", abbr: "2 R", chapters: 25 },
          { name: "1 Chroniques", abbr: "1 Ch", chapters: 29 },
          { name: "2 Chroniques", abbr: "2 Ch", chapters: 36 },
          { name: "Esdras", abbr: "Es", chapters: 10 },
          { name: "Néhémie", abbr: "Ne", chapters: 13 },
          { name: "Esther", abbr: "Est", chapters: 10 },
          { name: "Job", abbr: "Jb", chapters: 42 },
          { name: "Psaumes", abbr: "Ps", chapters: 150 },
          { name: "Proverbes", abbr: "Pr", chapters: 31 },
          { name: "Ecclésiaste", abbr: "Ec", chapters: 12 },
          { name: "Cantique des cantiques", abbr: "Ct", chapters: 8 },
          { name: "Ésaïe", abbr: "És", chapters: 66 },
          { name: "Jérémie", abbr: "Jr", chapters: 52 },
          { name: "Lamentations", abbr: "Lm", chapters: 5 },
          { name: "Ézéchiel", abbr: "Éz", chapters: 48 },
          { name: "Daniel", abbr: "Dn", chapters: 12 },
          { name: "Osée", abbr: "Os", chapters: 14 },
          { name: "Joël", abbr: "Jl", chapters: 3 },
          { name: "Amos", abbr: "Am", chapters: 9 },
          { name: "Abdias", abbr: "Ab", chapters: 1 },
          { name: "Jonas", abbr: "Jon", chapters: 4 },
          { name: "Michée", abbr: "Mi", chapters: 7 },
          { name: "Nahum", abbr: "Na", chapters: 3 },
          { name: "Habacuc", abbr: "Ha", chapters: 3 },
          { name: "Sophonie", abbr: "So", chapters: 3 },
          { name: "Aggée", abbr: "Ag", chapters: 2 },
          { name: "Zacharie", abbr: "Za", chapters: 14 },
          { name: "Malachie", abbr: "Ml", chapters: 4 }
        ]
      },
      {
        section: "Nouveau Testament",
        books: [
          { name: "Matthieu", abbr: "Mt", chapters: 28 },
          { name: "Marc", abbr: "Mc", chapters: 16 },
          { name: "Luc", abbr: "Lc", chapters: 24 },
          { name: "Jean", abbr: "Jn", chapters: 21 },
          { name: "Actes des apôtres", abbr: "Act", chapters: 28 },
          { name: "Romains", abbr: "Rm", chapters: 16 },
          { name: "1 Corinthiens", abbr: "1 Co", chapters: 16 },
          { name: "2 Corinthiens", abbr: "2 Co", chapters: 13 },
          { name: "Galates", abbr: "Ga", chapters: 6 },
          { name: "Éphésiens", abbr: "Ép", chapters: 6 },
          { name: "Philippiens", abbr: "Ph", chapters: 4 },
          { name: "Colossiens", abbr: "Col", chapters: 4 },
          { name: "1 Thessaloniciens", abbr: "1 Th", chapters: 5 },
          { name: "2 Thessaloniciens", abbr: "2 Th", chapters: 3 },
          { name: "1 Timothée", abbr: "1 Tm", chapters: 6 },
          { name: "2 Timothée", abbr: "2 Tm", chapters: 4 },
          { name: "Tite", abbr: "Tt", chapters: 3 },
          { name: "Philémon", abbr: "Phm", chapters: 1 },
          { name: "Hébreux", abbr: "He", chapters: 13 },
          { name: "Jacques", abbr: "Jc", chapters: 5 },
          { name: "1 Pierre", abbr: "1 P", chapters: 5 },
          { name: "2 Pierre", abbr: "2 P", chapters: 3 },
          { name: "1 Jean", abbr: "1 Jn", chapters: 5 },
          { name: "2 Jean", abbr: "2 Jn", chapters: 1 },
          { name: "3 Jean", abbr: "3 Jn", chapters: 1 },
          { name: "Jude", abbr: "Jude", chapters: 1 },
          { name: "Apocalypse", abbr: "Ap", chapters: 22 }
        ]
      }
    ];

    const STORAGE_KEY = "bibleTousSimple_v1";

    function loadProgress() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return {};
        const data = JSON.parse(raw);
        if (typeof data !== "object" || data === null) return {};
        return data;
      } catch {
        return {};
      }
    }

    function saveProgress(data) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }

    function chapterKey(bookName, chapterNumber) {
      return `${bookName}:${chapterNumber}`;
    }

    function render() {
      const progress = loadProgress();
      const app = document.getElementById("app");
      app.innerHTML = "";

      let totalChapters = 0;
      let checkedChapters = 0;

      for (const section of bible) {
        const sectionTitle = document.createElement("h2");
        sectionTitle.textContent = section.section;
        app.appendChild(sectionTitle);

        for (const book of section.books) {
          const bookDiv = document.createElement("div");
          bookDiv.className = "book";

          const title = document.createElement("div");
          title.className = "book-title";
          title.textContent = `${book.name} (${book.abbr})`;
          bookDiv.appendChild(title);

          const chaptersGrid = document.createElement("div");
          chaptersGrid.className = "chapters";

          for (let c = 1; c <= book.chapters; c++) {
            const key = chapterKey(book.name, c);
            const btn = document.createElement("button");
            btn.className = "chapter";

            // Affichage explicite du numéro
            btn.textContent = String(c);

            if (progress[key]) {
              btn.classList.add("checked");
              checkedChapters++;
            }

            btn.addEventListener("click", () => {
              const current = loadProgress();
              if (current[key]) {
                delete current[key];
              } else {
                current[key] = true;
              }
              saveProgress(current);
              render();
            });

            chaptersGrid.appendChild(btn);
            totalChapters++;
          }

          bookDiv.appendChild(chaptersGrid);
          app.appendChild(bookDiv);
        }
      }

      console.log("Total chapitres:", totalChapters, "Lus:", checkedChapters);
    }

    render();
  </script>
</body>
</html>
