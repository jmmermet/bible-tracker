<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Test Overlay</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --bg: #f7f7f9;
      --card: #ffffff;
      --text: #222;
      --overlay-bg: rgba(0,0,0,0.6);
      --border: #e5e7eb;
      --accent: #2563eb;
    }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    header {
      position: sticky;
      top: 0;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      padding: 0.6rem 0.75rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }
    button {
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 6px;
      padding: 0.35rem 0.6rem;
      font-size: 0.75rem;
      cursor: pointer;
    }

    .books-overlay {
      position: fixed;
      top: 50px;
      left: 0;
      right: 0;
      bottom: 0;
      background: var(--overlay-bg);
      z-index: 40;
      display: none;
      padding: 0.5rem;
      overflow-y: auto;
    }
    .books-overlay.active {
      display: block;
    }
    .books-panel {
      background: var(--card);
      border-radius: 8px;
      padding: 0.6rem;
      max-height: 80vh;
      overflow-y: auto;
    }
    .container {
      padding: 1rem;
      max-width: 900px;
      margin: 0 auto;
    }
  </style>
</head>
<body>
  <header>
    <button id="menuToggle">Livres</button>
    <div>Test Overlay</div>
  </header>

  <div class="books-overlay" id="booksOverlay">
    <div class="books-panel">
      <div id="booksPanelContent">
        <p>Contenu de test dans l’overlay.</p>
      </div>
    </div>
  </div>

  <div class="container">
    <p>Contenu principal de la page.</p>
    <p>Si tu vois ce texte, la page s’affiche correctement.</p>
  </div>

  <script>
    const menuToggle = document.getElementById("menuToggle");
    const booksOverlay = document.getElementById("booksOverlay");

    menuToggle.addEventListener("click", () => {
      booksOverlay.classList.add("active");
    });

    booksOverlay.addEventListener("click", (e) => {
      if (e.target === booksOverlay) {
        booksOverlay.classList.remove("active");
      }
    });
  </script>
</body>
</html>
